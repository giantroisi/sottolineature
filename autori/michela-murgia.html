<style>
  :root {
    color-scheme: light;
    --paper: #f2f0eb;
    --paper-raised: #f8f7f3;
    --ink: #211f1b;
    --ink-soft: #5b564d;
    --ink-faint: #8c8577;
    --accent: #33523f;
    --accent-soft: #6b8574;
    --gold: #9c7a3c;
    --rule: #ddd9cf;
    --shadow: rgba(33, 31, 27, 0.08);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #16191a;
    --paper-raised: #1f2224;
    --ink: #ece7dd;
    --ink-soft: #a9a296;
    --ink-faint: #746e62;
    --accent: #8fb59b;
    --accent-soft: #5c7c68;
    --gold: #c9a45c;
    --rule: #33362f;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .page { max-width: 42rem; margin: 0 auto; padding: 4.5rem 1.75rem 6rem; }
  .back-link {
    display: inline-block;
    font-size: 0.85rem;
    color: var(--ink-soft);

    border-bottom: 1px solid var(--accent-soft);
    margin-bottom: 2.5rem;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }
  .theme-toggle {
    all: unset;
    position: fixed;
    top: 1.1rem;
    left: 1.1rem;
    z-index: 20;
    width: 2.4rem;
    height: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 50%;
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }
  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.9rem;
  }
  h1 { font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 0.75rem; line-height: 1.2; }
  .count { font-size: 0.95rem; color: var(--ink-faint); margin: 0 0 2.5rem; }
  .card {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
    position: relative;
    margin: 0 0 2rem;
    padding: 0.1rem 0 0.1rem 1.35rem;
    border-left: 2px solid var(--rule);
  }
  .card-mark {
    position: absolute; left: -0.15rem; top: -1.1rem;
    font-size: 3rem; font-family: Georgia, serif; color: var(--gold); opacity: 0.35; line-height: 1;
  }
  .card-quote { font-size: 1.05rem; line-height: 1.55; font-style: italic; margin: 0 0 0.6rem; }
  .card-quote a { color: inherit; text-decoration: none; }
  .card-quote a:hover { color: var(--accent); }
  .card-citation { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }
  .card-citation .card-title { font-style: italic; }
  .card-citation a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .card-citation a:hover { color: var(--gold); border-color: var(--gold); }
  .hub-nav { margin-bottom: 3rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; }
  .hub-nav a {
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .hub-nav a:hover, .hub-nav a.is-current { color: var(--accent); border-color: var(--accent); }
  footer.sans {
    margin-top: 3.5rem;
    padding-top: 1.75rem;
    border-top: 1px solid var(--rule);
    font-size: 0.85rem;
    color: var(--ink-faint);
  }
</style>
<script>
  try {
    var savedTheme = localStorage.getItem('sottolineature-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
  } catch (e) {}
</script>

<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema chiaro/scuro">☾</button>
<div class="page">
  <a class="back-link sans" href="../index.html">← Tutte le citazioni</a>
  <p class="eyebrow sans">Un autore</p>
  <h1>Michela Murgia</h1>
  <p class="count sans">1 citazione</p>
  <nav class="hub-nav sans"></nav>
  <article class="card"><span class="card-mark" aria-hidden="true">“</span><div class="card-body"><p class="card-quote"><a href="../citazioni/michela-murgia-accabadora.html">Nessuno può sapere quanto rumore fa una certezza che si rompe.</a></p><p class="card-citation sans"><a href="../citazioni/michela-murgia-accabadora.html"><span class="card-author">Michela Murgia</span> — <span class="card-title">Accabadora</span> · <span class="card-year">2009</span></a></p></div></article>
  <footer class="sans">
    Da <a href="../index.html" style="color:var(--ink-faint)">Sottolineature</a> — citazioni verificate a mano, senza algoritmo.
  </footer>
</div>
<script>
  (function () {
    var toggle = document.getElementById('themeToggle');
    var root = document.documentElement;
    function currentTheme() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function render() { toggle.textContent = currentTheme() === 'dark' ? '☀' : '☾'; }
    render();
    toggle.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      if (next === 'dark') { root.setAttribute('data-theme', 'dark'); } else { root.removeAttribute('data-theme'); }
      try { localStorage.setItem('sottolineature-theme', next); } catch (e) {}
      render();
    });
  })();
</script>
</body>

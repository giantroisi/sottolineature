# No push/deployment/preview trigger. Manual owner confirmation only.
name: IndexNow production (manual)
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact current main SHA already deployed successfully in production
        required: true
        type: string
      urls_json:
        description: Explicit JSON array of canonical sitemap URLs
        required: true
        type: string
      confirm_submission:
        description: I explicitly authorize submitting only these URLs now
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  deployments: read
  pull-requests: read
jobs:
  notify:
    if: github.actor == 'giantroisi' && github.ref == 'refs/heads/main' && inputs.confirm_submission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify main, merged PR, successful Vercel Production and exact sitemap URLs
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: ${{ inputs.production_sha }}
          URLS_JSON: ${{ inputs.urls_json }}
        run: python3 -I tools/indexnow_production.py --root "$GITHUB_WORKSPACE" --production-sha "$PRODUCTION_SHA" --urls-json "$URLS_JSON" --confirm

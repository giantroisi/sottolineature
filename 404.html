<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f0eb">
<title>Pagina non trovata — Sottolineature</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    color-scheme: light;
    --paper: #f2f0eb;
    --paper-raised: #f8f7f3;
    --ink: #211f1b;
    --ink-soft: #5b564d;
    --ink-faint: #8c8577;
    --accent: #33523f;
    --accent-soft: #6b8574;
    --gold: #9c7a3c;
    --rule: #ddd9cf;
    --shadow: rgba(33, 31, 27, 0.08);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #16191a;
    --paper-raised: #1f2224;
    --ink: #ece7dd;
    --ink-soft: #a9a296;
    --ink-faint: #746e62;
    --accent: #8fb59b;
    --accent-soft: #5c7c68;
    --gold: #c9a45c;
    --rule: #33362f;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .page { max-width: 30rem; margin: 0 auto; padding: 2rem; text-align: center; }
  .mark { font-size: 4rem; font-family: Georgia, serif; color: var(--gold); opacity: 0.5; line-height: 1; margin: 0 0 1rem; }
  h1 { font-weight: 400; font-size: 1.6rem; margin: 0 0 1rem; }
  p { font-size: 1rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 2rem; }
  .back-link {
    display: inline-block;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
    padding-bottom: 2px;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }
  .theme-toggle {
    all: unset;
    position: fixed;
    top: 1.1rem;
    left: 1.1rem;
    width: 2.4rem;
    height: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 50%;
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }
</style>
<script>
  try {
    var savedTheme = localStorage.getItem('sottolineature-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
  } catch (e) {}
</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema chiaro/scuro">☾</button>
<div class="page">
  <p class="mark" aria-hidden="true">“</p>
  <h1>Questa pagina non esiste.</h1>
  <p>O forse è stata segnata in un libro sbagliato. Torna alla raccolta e riparti da lì.</p>
  <a class="back-link sans" href="/">← Torna a Sottolineature</a>
</div>
<script>
  (function () {
    var toggle = document.getElementById('themeToggle');
    var root = document.documentElement;
    function currentTheme() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function render() { toggle.textContent = currentTheme() === 'dark' ? '☀' : '☾'; }
    render();
    toggle.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      if (next === 'dark') { root.setAttribute('data-theme', 'dark'); } else { root.removeAttribute('data-theme'); }
      try { localStorage.setItem('sottolineature-theme', next); } catch (e) {}
      render();
    });
  })();
</script>
</body>
</html>
